name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt5 pyinstaller

      - name: Build
        run: pyinstaller --noconfirm gamma-slider.spec

      - name: Zip onedir
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $zip = "gamma-slider-windows-$tag.zip"
          Compress-Archive -Path dist/gamma-slider -DestinationPath $zip
          if (-not (Test-Path "dist/gamma-slider/gamma-slider.exe")) {
            throw "gamma-slider.exe missing from onedir output"
          }
          Write-Host "Created $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gamma-slider-windows
          path: gamma-slider-windows-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gamma-slider-windows-*.zip
