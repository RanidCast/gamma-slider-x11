name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt5 pyinstaller

      - name: Build icon
        run: python3 packaging/macos/make_icns.py

      - name: Build
        run: pyinstaller --noconfirm gamma-slider-macos.spec

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Gamma Slider.app"

      - name: Create DMG
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="dev"
          fi
          stage="$(mktemp -d)"
          dmg="gamma-slider-macos-${tag}.dmg"
          test -d "dist/Gamma Slider.app"
          cp -R "dist/Gamma Slider.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Gamma Slider" -srcfolder "$stage" -ov -format UDZO "$dmg"
          echo "Created $dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: gamma-slider-macos
          path: gamma-slider-macos-*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gamma-slider-macos-*.dmg
